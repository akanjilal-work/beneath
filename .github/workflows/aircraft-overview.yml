name: Aircraft overview

# Every aircraft OpenSky tracks, fetched every 15 minutes into the R2 file the Worker serves at
# /aircraft/global. OpenSky does not answer requests from Cloudflare's network, so the fetch runs
# here; OpenSky's anonymous limit allows about one global call every 15 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aircraft-overview
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --no-warnings scripts/aircraft-overview.ts "$RUNNER_TEMP/aircraft-global.json"
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler r2 object put beneath-data/live/aircraft-global.json --remote
          --file "$RUNNER_TEMP/aircraft-global.json" --content-type application/json
          --cache-control "public, max-age=300"
