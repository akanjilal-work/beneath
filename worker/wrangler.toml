name = "beneath-live"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Poll NOAA SWPC every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

# The public data bucket (tiles + live JSON). No credentials live in this repo;
# the binding is granted to the Worker by Cloudflare.
[[r2_buckets]]
binding = "DATA"
bucket_name = "beneath-data"

[vars]
ALLOWED_ORIGINS = "https://akanjilal-work.github.io,https://beneath.akanjilal.dev,http://localhost:5173"

[observability]
enabled = true
